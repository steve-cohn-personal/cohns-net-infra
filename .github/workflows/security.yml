name: security

# Static analysis of the Terraform. No cloud access — this reads code, it never
# touches AWS, so there is no OIDC role and no credentials here.
#
# Both GATE. The original checkov backlog (93 findings) was triaged: genuine issues
# fixed (SG descriptions, ALB drop-invalid-headers, SNS encryption, HLS CDN HSTS),
# resource-specific exceptions marked with inline `checkov:skip` comments, and
# policy-level trade-offs recorded in .checkov.yaml with a reason each. The tree is
# clean, so any NEW finding now fails the PR. SARIF still uploads to the Security
# tab for visibility.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
      - '.tflint.hcl'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
      - '.tflint.hcl'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - name: init plugins
        run: tflint --init
        env:
          # Authenticated plugin downloads avoid GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: tflint
        run: tflint --recursive --no-color

  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install checkov
        run: pip install checkov
      - name: checkov (gating)
        run: >
          checkov --directory terraform --framework terraform --config-file .checkov.yaml
          --output cli --output sarif --output-file-path console,results.sarif
      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov
