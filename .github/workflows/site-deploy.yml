name: deploy-site

# Content deploys are separate from infrastructure applies. Editing a paragraph
# should not require a Terraform plan, and a Terraform change should not silently
# republish content.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site-deploy.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options: [dev, stage, prod]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Cache-bust the un-hashed assets: stamp every /js, /css, /vendor reference in
      # the HTML with this deploy's short commit SHA (?v=<sha>). HTML is served
      # no-cache (below), so browsers re-fetch it every visit, see the new query, and
      # pull fresh JS/CSS instead of a stale 1-hour-cached copy — which matters for
      # correctness now (e.g. the affiliate tag lives in md.js). The asset files keep
      # stable names; S3/CloudFront ignore the query for lookup, so no rename/build
      # step is needed. Only rewritten when the SHA changes, so it's a no-op re-run.
      - name: version assets in html
        run: |
          VER="${GITHUB_SHA::8}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            "s#(\"/(js|css|vendor)/[A-Za-z0-9._/-]+\.(js|css))\"#\1?v=${VER}\"#g"

      # Assets are served under stable, un-hashed names (/js/auth.js,
      # /css/main.css, /vendor/hls.min.js, /favicon.svg), so we can't use an
      # immutable year-long cache — browsers would pin a stale copy that a
      # CloudFront invalidation can't reach. Cap the browser cache at an hour
      # and lean on stale-while-revalidate for a fast, self-healing refresh.
      # HTML stays no-cache so a deploy is visible immediately.
      - name: sync assets
        run: |
          aws s3 sync site/ "s3://${{ vars.SITE_BUCKET }}/" \
            --delete \
            --exclude '*.html' \
            --cache-control 'public,max-age=3600,stale-while-revalidate=86400'

      - name: sync html
        run: |
          aws s3 sync site/ "s3://${{ vars.SITE_BUCKET }}/" \
            --delete \
            --exclude '*' --include '*.html' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: invalidate cdn
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" \
            --paths '/*'
