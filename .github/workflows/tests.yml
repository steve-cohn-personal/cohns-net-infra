name: tests

# Unit tests for the repo's Python. Two independent jobs, each triggered only by
# changes under its own tree:
#   scripts       — stdlib-only helper-script tests (no dependency install)
#   comments-api  — the FastAPI service's pytest suite (SQLite-backed, no DB service)
# Neither needs cloud access.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'services/comments-api/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'services/comments-api/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: unit tests
        working-directory: scripts
        # Discovery picks up every scripts/test_*.py — new tests need no edit here.
        run: python -m unittest discover -p 'test_*.py' --verbose

  comments-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: install (test deps)
        working-directory: services/comments-api
        # The dev extra pulls in aiosqlite + pytest; tests run on SQLite, so no
        # asyncpg/Postgres and no database service are needed.
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: services/comments-api
        run: python -m pytest -q
