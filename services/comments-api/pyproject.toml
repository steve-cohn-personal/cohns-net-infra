[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comments-api"
version = "0.1.0"
description = "Auth-gated, moderated, rate-limited comments API for cohns.net"
requires-python = ">=3.12"

# Runtime deps. asyncpg (Postgres driver) is prod-only and installed in the
# container; local tests run on aiosqlite, so it is an optional extra.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9", # crypto extra = RS256/JWKS support for Cognito verification
    "slowapi>=0.1.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Production runtime: Postgres driver + boto3 for reading the DB secret.
postgres = ["asyncpg>=0.30", "boto3>=1.35"]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "boto3>=1.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
